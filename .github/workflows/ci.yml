name: CI

# 普通 CI 会执行 PR 代码，因此只用 push 和 pull_request，不能用 pull_request_target。
# risk-gate 的受限模式是例外：它只运行可信 base，PR head 仅作为 Git 数据读取。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 安装依赖
        run: uv sync --locked
      - name: 代码风格
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: 类型检查
        run: uv run pyright
      - name: 测试（含内核纯度检查）
        run: uv run pytest
      - name: 冒烟测试（跑一遍 demo）
        run: uv run tandem demo
