name: PR 风险等级闸门

# 仅运行 PR 检查；分支内的闸门仍可被同一 PR 修改，须由分支保护和人工批准兜底。
on:
  pull_request:

permissions:
  contents: read

jobs:
  risk-level:
    name: risk-level
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: 安装依赖
        run: uv sync --locked
      - name: 按真实改动计算等级（D 级需要人工）
        # 默认从 GITHUB_EVENT_PATH 读取 base/head，不把 PR 文本插入 shell 命令。
        run: >-
          uv run python scripts/gate/risk_level.py
          --output "$RUNNER_TEMP/risk-level.json"
          --summary "$RUNNER_TEMP/risk-level.md"
      - name: 写入检查摘要
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/risk-level.md" ]; then
            cat "$RUNNER_TEMP/risk-level.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '等级闸门未生成结果，请检查前序步骤日志；不能放行。' >> "$GITHUB_STEP_SUMMARY"
          fi
