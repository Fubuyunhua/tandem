name: PR 风险等级闸门

# 安全模式：工作流及裁判来自基准分支，避免 PR 修改自己的裁判。
# pull_request_target 只有在绝不执行 head 代码时才适用；本工作流只 fetch head 对象。
# 不 checkout/安装/导入 head，不执行其中的脚本、构建钩子或本地 Action。
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  risk-level:
    name: risk-level
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 仅获取 PR head 提交对象（不检出）
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          # 公开仓库匿名读取提交对象，不向 fetch 提供令牌。
          git fetch --no-tags --no-recurse-submodules origin "$PR_HEAD_SHA"
      - uses: astral-sh/setup-uv@v6
      - name: 仅安装 base 工作树及其锁定依赖
        run: uv sync --locked
      - name: 按真实改动计算等级（D 级需要人工）
        # 默认从 GITHUB_EVENT_PATH 读取 base/head，不把 PR 文本插入 shell 命令。
        run: >-
          uv run python scripts/gate/risk_level.py
          --output "$RUNNER_TEMP/risk-level.json"
          --summary "$RUNNER_TEMP/risk-level.md"
      - name: 写入检查摘要
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/risk-level.md" ]; then
            cat "$RUNNER_TEMP/risk-level.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '等级闸门未生成结果，请检查前序步骤日志；不能放行。' >> "$GITHUB_STEP_SUMMARY"
          fi
