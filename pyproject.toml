[project]
name = "tandem"
version = "0.0.1"
description = "个人 AI 开发循环系统：AI 承担大部分实现，你持续锻炼建模、架构和批判能力"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["learn", "research", "external"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
