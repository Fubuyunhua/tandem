# tandem 专用发行版的 /etc/wsl.conf
#
# 目的：把后台 Agent 关在一个碰不到 Windows 的盒子里。
# 由 scripts/wsl/setup-tandem-distro.ps1 写入发行版；改完要 `wsl --terminate tandem` 才生效。
# 注意：WSL 默认会把 C 盘挂到 /mnt/c，并且能把 Windows 的 PATH 和 .exe 带进来。
#       下面三项全关掉，才谈得上隔离（还需要用诱饵测试验证）。

[automount]
# 不自动挂载 Windows 磁盘：/mnt/c、/mnt/d 都不会出现。
enabled = false

[interop]
# 不能调用 Windows 程序：cmd.exe、explorer.exe、/init 都用不了。
enabled = false
# 不把 Windows 的 PATH 追加进 Linux 的 PATH。
appendWindowsPath = false
